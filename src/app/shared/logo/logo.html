<svg
  #svg
  class="logo"
  xmlns="http://www.w3.org/2000/svg"
  [attr.viewBox]="viewBox"
  [attr.role]="label() ? 'img' : null"
  [attr.aria-label]="label() || null"
  [attr.aria-hidden]="label() ? null : 'true'"
  focusable="false"
>
  <g [attr.transform]="pathTransform">
    <path class="logo__part logo__part--taison" [attr.d]="paths.taison" />
    <path class="logo__part logo__part--t" [attr.d]="paths.t" />
    <path class="logo__part logo__part--ols" [attr.d]="paths.ols" />
  </g>
  <circle
    class="logo__ring"
    [attr.cx]="ring.cx"
    [attr.cy]="ring.cy"
    [attr.r]="ring.r"
    [attr.stroke-width]="ring.stroke"
    [attr.transform]="'rotate(-90 ' + ring.cx + ' ' + ring.cy + ')'"
    pathLength="1"
  />
  <!-- Outer group follows the pointer, inner group runs the entrance; the path keeps
       its own transform, which a CSS transform on the same element would replace. -->
  <!-- SVG strokes are centred on the path. To keep the line outside the cursor only, it is
       drawn twice as wide and its inner half is masked away by the cursor's own shape. -->
  <defs>
    <mask [attr.id]="maskId" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36">
      <rect x="-6" y="-6" width="36" height="36" fill="#fff" />
      <path [attr.d]="cursor.d" fill="#000" />
    </mask>
  </defs>
  <g class="logo__cursor" [style.transform]="'rotate(' + angle() + 'deg)'">
    <g class="logo__cursor-intro">
      <path
        [attr.transform]="cursor.transform"
        [attr.d]="cursor.d"
        [attr.stroke-width]="cursor.outline * 2"
        [attr.mask]="'url(#' + maskId + ')'"
      />
    </g>
  </g>
</svg>
