<header class="header">
  <div class="header__bar container">
    <a
      class="brand"
      href="#inicio"
      (click)="navigate($event, 'inicio')"
      aria-label="TaisonTools, ir al inicio"
    >
      <span class="brand__mark" aria-hidden="true"><span></span><span></span></span>
      <span class="brand__word">TAISON<b>TOOLS</b></span>
    </a>

    <nav class="nav" aria-label="Principal">
      <ul class="nav__list">
        @for (item of items; track item.id) {
          <li>
            <a
              class="nav__link"
              [class.is-active]="active() === item.id"
              [attr.aria-current]="active() === item.id ? 'true' : null"
              [href]="'#' + item.id"
              (click)="navigate($event, item.id)"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>

    <a class="header__cta btn btn--primary" href="#contacto" (click)="navigate($event, 'contacto')">
      Hablemos
    </a>

    <button
      #toggle
      class="toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      (click)="toggleMenu()"
    >
      <span class="visually-hidden">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      <span class="toggle__line toggle__line--top" aria-hidden="true"></span>
      <span class="toggle__line toggle__line--bottom" aria-hidden="true"></span>
    </button>
  </div>

  <div
    id="mobile-menu"
    class="menu"
    [attr.aria-hidden]="!menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <nav #mobileNav class="menu__nav container" aria-label="Menú móvil">
      <ol class="menu__list">
        @for (item of items; track item.id; let i = $index) {
          <li class="menu__item" [style.--i]="i">
            <a
              class="menu__link"
              [class.is-active]="active() === item.id"
              [href]="'#' + item.id"
              (click)="navigate($event, item.id)"
            >
              <span class="menu__index t-label">0{{ i + 1 }}</span>
              {{ item.label }}
            </a>
          </li>
        }
      </ol>
      <div class="menu__foot">
        <span class="t-label">{{ brand.tagline }}</span>
        <span class="t-label">{{ brand.location }}</span>
      </div>
    </nav>
  </div>
</header>
