<section id="inicio" class="hero" aria-labelledby="hero-title">
  <!-- Full-screen brand: the wordmark over the interactive honeycomb -->
  <div class="hero__stage">
    <div class="hero__media" aria-hidden="true">
      <tt-hex-field class="hero__field" />
    </div>

    <div class="hero__brand container">
      <tt-logo class="hero__logo" [interactive]="true" label="TaisonTools" />
      <p class="hero__meta t-label">
        <span class="hero__roles">
          <span>Desarrollo</span>
          <span class="hero__roles-amp">&amp;</span>
          <span class="hero__roles-last">Diseño UX/UI</span>
        </span>
      </p>
    </div>

    <a
      class="hero__down"
      [class.is-away]="away()"
      href="#intro"
      aria-label="Bajar a la siguiente sección"
      (click)="navigate($event, 'intro')"
    >
      <tt-icon name="arrow-down" />
    </a>
  </div>

  <!-- Second screen: fills the viewport under the header, so only this copy is in view -->
  <div id="intro" class="hero__inner container">
    <div class="hero__copy">
      <h1 id="hero-title" class="hero__title t-display">
        <tt-staggered-text text="Donde el código y el diseño trabajan juntos" accent="." by="word" />
      </h1>

      <p class="hero__lead t-lead" ttReveal [revealDelay]="120">
        TaisonTools es un estudio formado por un desarrollador full-stack y un diseñador UX/UI.
        Creamos sitios, aplicaciones y software a medida donde cada pantalla se piensa y se
        construye en conjunto.
      </p>

      <div class="hero__actions" ttReveal [revealDelay]="220">
        <a class="btn-ink" href="#contacto" (click)="navigate($event, 'contacto')">
          <span class="btn-ink__clip"><span class="btn-ink__text">Hablemos</span></span>
        </a>
        <a class="btn btn--ghost" href="#proyectos" (click)="navigate($event, 'proyectos')">
          Ver proyectos
        </a>
      </div>
    </div>
  </div>
</section>
